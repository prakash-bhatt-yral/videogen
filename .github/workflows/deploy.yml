name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      host:
        description: "Vast.ai Host IP"
        required: true
        type: string
      port:
        description: "Vast.ai SSH Port"
        required: true
        type: string
      run_setup:
        description: "Run setup.sh (installs models/nodes)"
        type: boolean
        default: false
      named_tunnel:
        description: "Use named CF tunnel (videogen.prakash.yral.com). False = quick tunnel for testing."
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: videogen-worker

jobs:
  build:
    name: Build (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: videogen-worker-linux-amd64
          path: target/x86_64-unknown-linux-gnu/release/videogen-worker
          retention-days: 7

  deploy:
    name: Deploy to Vast.ai
    needs: build
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: videogen-worker-linux-amd64
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/videogen-worker

      - name: Resolve Vast.ai connection
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "host=${{ github.event.inputs.host }}" >> $GITHUB_OUTPUT
            echo "port=${{ github.event.inputs.port }}" >> $GITHUB_OUTPUT
            echo "run_setup=${{ github.event.inputs.run_setup }}" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.VASTAI_HOST }}" >> $GITHUB_OUTPUT
            echo "port=${{ secrets.VASTAI_PORT }}" >> $GITHUB_OUTPUT
            echo "run_setup=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VASTAI_SSH_KEY }}" > ~/.ssh/vastai
          chmod 600 ~/.ssh/vastai
          echo -e "Host vastai\n  HostName ${{ steps.resolve.outputs.host }}\n  Port ${{ steps.resolve.outputs.port }}\n  User root\n  IdentityFile ~/.ssh/vastai\n  StrictHostKeyChecking no" > ~/.ssh/config
          ssh-keyscan -H 94.130.13.115 88.99.151.102 138.201.129.173 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Open RabbitMQ firewall for Vast.ai host
        run: |
          VASTAI_IP="${{ steps.resolve.outputs.host }}"
          for NODE in 94.130.13.115 88.99.151.102 138.201.129.173; do
            ssh -i ~/.ssh/vastai deploy@${NODE} "
              sudo iptables -N RABBITMQ-FILTER 2>/dev/null || true
              sudo iptables -C INPUT -p tcp --dport 5671 -j RABBITMQ-FILTER 2>/dev/null \
                || sudo iptables -I INPUT 1 -p tcp --dport 5671 -j RABBITMQ-FILTER
              sudo iptables -C RABBITMQ-FILTER -p tcp --dport 5671 -s ${VASTAI_IP} -j ACCEPT 2>/dev/null \
                || sudo iptables -I RABBITMQ-FILTER 1 -p tcp --dport 5671 -s ${VASTAI_IP} -j ACCEPT
              echo 'rule ok on ${NODE}'
            "
          done

      - name: Stop existing worker (Free binary lock)
        run: ssh vastai "tmux kill-session -t worker 2>/dev/null || true"

      - name: Deploy binary and scripts
        run: |
          scp ./bin/videogen-worker vastai:/workspace/videogen-worker
          scp ./deploy/start.sh vastai:/workspace/start.sh
          scp ./deploy/setup.sh vastai:/workspace/setup.sh

      - name: Run Setup (Optional)
        if: steps.resolve.outputs.run_setup == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ssh vastai "HF_TOKEN=${HF_TOKEN} bash /workspace/setup.sh"

      - name: Start services
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BESZEL_KEY: ${{ secrets.BESZEL_KEY }}
          BESZEL_TOKEN: ${{ secrets.BESZEL_TOKEN }}
          VIDEOGEN_RABBITMQ_CONSUMER_PASSWORD: ${{ secrets.VIDEOGEN_RABBITMQ_CONSUMER_PASSWORD }}
          VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64: ${{ secrets.VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64 }}
          VIDEOGEN_CALLBACK_SIGNING_KEY_ID: ${{ secrets.VIDEOGEN_CALLBACK_SIGNING_KEY_ID }}
          VIDEOGEN_CALLBACK_SIGNING_SECRET_B64: ${{ secrets.VIDEOGEN_CALLBACK_SIGNING_SECRET_B64 }}
        run: |
          ssh vastai << 'DEPLOY_EOF'
            set -e

            # Stop existing services (tunnel preserved to keep quick tunnel URL stable)
            tmux kill-session -t worker 2>/dev/null || true
            tmux kill-session -t beszel 2>/dev/null || true

            chmod +x /workspace/videogen-worker /workspace/start.sh

            # Export env vars for start.sh
            export AUTH_TOKEN="${{ secrets.AUTH_TOKEN }}"
            export SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
            if [ "${{ github.event.inputs.named_tunnel }}" != "false" ]; then
              export CF_TUNNEL_TOKEN="${{ secrets.CF_TUNNEL_TOKEN }}"
              export CF_TUNNEL_HOSTNAME="videogen.prakash.yral.com"
            fi
            export BESZEL_KEY="${{ secrets.BESZEL_KEY }}"
            export BESZEL_TOKEN="${{ secrets.BESZEL_TOKEN }}"
            export VIDEOGEN_RABBITMQ_CONSUMER_PASSWORD="${{ secrets.VIDEOGEN_RABBITMQ_CONSUMER_PASSWORD }}"
            export VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64="${{ secrets.VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64 }}"
            export VIDEOGEN_CALLBACK_SIGNING_KEY_ID="${{ secrets.VIDEOGEN_CALLBACK_SIGNING_KEY_ID }}"
            export VIDEOGEN_CALLBACK_SIGNING_SECRET_B64="${{ secrets.VIDEOGEN_CALLBACK_SIGNING_SECRET_B64 }}"

            # Ensure worker starts on port 18288
            export PORT=18288
            export COMFYUI_API_BASE=http://localhost:18188

            bash /workspace/start.sh

            echo "=== Deployment complete ==="
          DEPLOY_EOF

      - name: Verify deployment
        run: |
          echo "Waiting for worker to start..."
          sleep 10
          ssh vastai "curl -sf http://localhost:18288/health | jq ." || echo "Worker health check failed (might still be starting or model loading)"
